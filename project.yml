name: Itinerary

options:
  bundleIdPrefix: com.leonardoramirezr
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    # Bundle identifier of the app. CI passes the same value with `APP_BUNDLE_ID=...`.
    # Future extensions must use `$(APP_BUNDLE_ID).<suffix>`.
    APP_BUNDLE_ID: com.leonardoramirezr.itinerarybyleoneralabs
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Itinerary:
    type: application
    platform: iOS
    sources:
      - path: Itinerary
    settings:
      base:
        PRODUCT_NAME: Itinerary
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES

schemes:
  Itinerary:
    build:
      targets:
        Itinerary: all
    run:
      config: Debug
    archive:
      config: Release
